<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0f05">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Draftsito">
<title>Draftsito</title>
<style>
:root{--bg:#edf0f3;--pn:#fbfcfd;--tx:#16212c;--mu:#5d6b78;--ac:#2b5fb0;--on:#fff;--gold:#a87400;--ln:#cfd6dd;--bad:#b3362b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--pn:#17202a;--tx:#e6ecf2;--mu:#93a1af;--ac:#6c9bea;--on:#0f151b;--gold:#e0b24a;--ln:#2a3541;--bad:#ef8a7e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f151b;--pn:#17202a;--tx:#e6ecf2;--mu:#93a1af;--ac:#6c9bea;--on:#0f151b;--gold:#e0b24a;--ln:#2a3541;--bad:#ef8a7e;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:1.5rem;margin:6px 0 14px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:22px 0 8px}
.tabs{display:flex;overflow-x:auto;border-bottom:2px solid var(--ln);margin-bottom:16px}
.tabs button{flex:1 0 auto;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 12px;font:inherit;font-weight:600;color:var(--mu);cursor:pointer}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:9px 10px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.b{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--ac);background:var(--ac);color:var(--on);padding:10px 14px;cursor:pointer}
button.b.g{background:none;color:var(--ac)}
button.b.r{background:none;color:var(--bad);border-color:var(--ln)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sc{overflow-x:auto;border:1px solid var(--ln);border-radius:8px;background:var(--pn)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--ln)}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
td b{font-size:1.2rem}
.hi{border:1px solid var(--ln);background:var(--pn);border-radius:8px;margin-bottom:10px}
.hi summary{padding:12px;cursor:pointer}
.hi summary b{display:block}
.hi summary span,.cap{color:var(--mu);font-size:.9rem}
.hi .in{padding:0 12px 12px}
.rc{border-top:1px solid var(--ln);padding:12px 0}
.mt{display:grid;grid-template-columns:2.2ch 1fr auto 1fr;gap:8px;align-items:center;margin:6px 0}
.mt i{color:var(--mu);font-style:normal;font-size:.85rem}
.mt button{font:inherit;padding:9px 6px;border-radius:6px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.res{margin:8px 0 0;font-size:.92rem}
.res .x{color:var(--gold);font-weight:600}
.em{color:var(--mu);padding:24px 4px}
.err{color:var(--bad);font-size:.9rem}
.hi{position:relative}
.hi summary{padding-right:56px}
.tr{position:absolute;top:8px;right:8px;background:none;border:1px solid var(--ln);border-radius:6px;padding:4px 8px;font:inherit;font-size:1rem;cursor:pointer;color:var(--bad)}
.tr.sure{border-color:var(--bad);font-size:.8rem;font-weight:600}
.lc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lp{border:1px solid var(--ln);background:var(--pn);border-radius:8px;padding:10px}
.lp .n{font-size:2.4rem;font-weight:700;text-align:center;margin:8px 0}
textarea{resize:vertical}
#toast{display:none;position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);text-align:center;white-space:pre-line;font-weight:600;z-index:10;cursor:pointer}
.nt{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--tx);color:var(--bg);border-radius:8px;padding:12px 14px;margin-bottom:12px;white-space:pre-line;font-weight:600}
.nt .b{flex:none;background:var(--bg);color:var(--tx);border-color:var(--bg)}
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button.b{min-height:44px}
td .b{min-height:36px}
.lg{font-size:2.6rem;text-align:center;margin:0 0 18px;letter-spacing:-.02em}
.mn{min-height:75vh;display:flex;flex-direction:column;justify-content:center;gap:10px}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:58px;padding:0 18px;font:inherit;font-size:1.1rem;font-weight:600;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:12px;cursor:pointer}
.mi::after{content:"›";color:var(--mu);font-size:1.5rem}
#back{display:none;position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:var(--on);align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:9}
.st{table-layout:fixed;width:100%}
.st th,.st td{padding:6px 3px;text-align:center;font-size:.9rem}
.st th:first-child,.st td:first-child{text-align:left;padding-left:8px}
.st td input{padding:7px 6px;font-size:.9rem}
.st td .b{font-size:.78rem;padding:4px 2px;width:100%;min-height:36px}
.st th svg{display:block;margin:0 auto}
.sm th:first-child{width:28%}.sm th:nth-child(2){width:12%}.sm th:nth-child(3),.sm th:nth-child(4),.sm th:nth-child(5){width:13%}.sm th:last-child{width:21%}
.pa th:first-child{width:30%}.pa th:nth-child(2){width:14%}.pa td:last-child{text-align:left}
.bl th:first-child{width:34%}.bl th:last-child{width:15%}
.rl{padding-left:2.2em}.rl li{margin:8px 0}
.lc2{position:fixed;inset:0;z-index:5;display:grid;grid-template-rows:1fr 1fr;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hf{position:relative;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px 12px 70px;min-height:0;overflow:hidden}
.hf.up{transform:rotate(180deg);background:var(--pn)}
.tp{display:flex;gap:8px;align-items:center}
.tp select{flex:1}
.ent{flex:1;min-height:40px;font:inherit;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);cursor:pointer}
.lp2{font-size:3rem;font-weight:700;text-align:center;line-height:1}
.kp,.ops{display:grid;grid-template-columns:repeat(5,1fr);justify-items:center;gap:6px}
.k{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:inherit;font-size:1.15rem;font-weight:600;padding:0;cursor:pointer}
.hf.up .k{background:var(--bg)}
.hf .ops .k{background:var(--ac);color:var(--on);border-color:var(--ac)}
.lov{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:3}
.die{font-size:6rem;color:#fff;animation:rl .8s ease-out}
.coin{width:110px;height:110px;border-radius:50%;background:#e0b24a;border:4px solid #a87400;color:#4d3500;font-size:1.4rem;font-weight:700;display:flex;align-items:center;justify-content:center;animation:fl 1s ease-out}
@keyframes rl{from{transform:rotate(0) scale(.3)}to{transform:rotate(540deg) scale(1)}}
@keyframes fl{from{transform:rotateY(0) scale(.5)}to{transform:rotateY(1080deg) scale(1)}}
#rst{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:4;width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font-size:1.2rem;cursor:pointer}
@media (max-height:700px){.k{width:36px;height:36px;font-size:1rem}.lp2{font-size:2.4rem}}
.bk{--pp:#f6efdc;--pt:#2b2316;background:var(--pp);color:var(--pt);border:1px solid var(--ln);border-radius:4px 12px 12px 4px;padding:22px 20px;font-family:Georgia,"Times New Roman",serif;box-shadow:inset 8px 0 10px -8px rgba(0,0,0,.4);min-height:50vh}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bk{--pp:#2a2519;--pt:#e8dfc8}}
:root[data-theme="dark"] .bk{--pp:#2a2519;--pt:#e8dfc8}
.ch{text-align:center;font-size:1.5rem;margin:6px 0 16px}
.ch::after{content:"❦";display:block;font-size:1rem;color:var(--gold);margin-top:6px}
.pgn{text-align:center;font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;opacity:.7}
.tx p{margin:0 0 12px;line-height:1.7;text-align:justify}
.tx p:first-child::first-letter{float:left;font-size:2.6em;line-height:.9;padding:2px 6px 0 0}
.ix{display:flex;justify-content:space-between;width:100%;padding:12px 4px;background:none;border:0;border-bottom:1px dotted var(--pt);color:var(--pt);font:inherit;font-size:1.05rem;cursor:pointer}
.bk textarea{background:transparent;color:var(--pt);font:inherit;border-color:var(--pt)}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.md{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:22px 20px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.md p{margin:0 0 16px;font-weight:600;font-size:1.05rem;white-space:pre-line}
.st td input{min-width:0}
td .b{white-space:nowrap;padding:6px 10px}
button.b:disabled{opacity:.45;cursor:default}

.mdl{display:block;width:34px;height:34px;margin:0 auto;border-radius:50%;border:2px solid #c28a00;box-shadow:0 0 0 1px #f4d27a,0 1px 3px rgba(0,0,0,.35);background-size:cover;background-position:center}

.lc2{background:radial-gradient(ellipse at 50% 50%,#0b4fbf 0,#052a73 45%,#02133d 100%);color:#fff}
.lc2::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,transparent,#4fd8ff,transparent)}
.lc2 .hf,.lc2 .hf.up{background:none}
.pnl{filter:drop-shadow(0 0 7px rgba(79,216,255,.8))}
.pc{background:#4fd8ff;padding:2px;clip-path:polygon(5% 0,95% 0,100% 50%,95% 100%,5% 100%,0 50%)}
.pni{background:linear-gradient(180deg,#0a49b8,#052d7a);clip-path:polygon(5% 0,95% 0,100% 50%,95% 100%,5% 100%,0 50%);padding:4px 0 8px;text-align:center}
.lpl{display:block;font-size:.75rem;letter-spacing:.25em;color:#bfe9ff}
.lc2 .lp2{font-weight:200;letter-spacing:.05em;font-size:3.2rem;text-shadow:0 0 12px rgba(120,220,255,.9)}
.lc2 .tp select{background:transparent;color:#fff;border:0;border-bottom:2px solid #fff;border-radius:0;font-weight:700}
.lc2 .tp select option{color:#000}
.lc2 .ent{background:rgba(0,40,110,.6);color:#fff;border:1px solid #4fd8ff;border-radius:0}
.lc2 .hf .k,.lc2 .hf.up .k{background:radial-gradient(#0f5fd6,#06307f);color:#fff;border:2px solid #4fd8ff;box-shadow:0 0 8px rgba(79,216,255,.6)}
.lc2 .hf .ops .k{background:radial-gradient(#27c3ff,#0a6fd0);border-color:#bfe9ff}
.lc2 #rst{right:auto;left:50%;transform:translate(-50%,-50%);width:60px;height:54px;background:#4fd8ff;border:0;border-radius:0;color:#fff;clip-path:polygon(0 0,100% 0,50% 100%);padding:0 0 14px}
.lc2 #rst::before{content:"";position:absolute;inset:0;z-index:-1;background:#0a49b8;clip-path:polygon(8% 8%,92% 8%,50% 88%)}
.cw{text-align:center;color:#fff;font-weight:700;font-size:1.3rem}
.cl{margin-top:8px}
img.coin{width:140px;height:140px;border-radius:50%;background:none;border:0;display:block;margin:0 auto;animation:fl 1s ease-out}

.mdK{border-color:#8c96a1;box-shadow:0 0 0 1px #e6ebf0,0 1px 3px rgba(0,0,0,.35)}
.mdJ{border-color:#8a5222;box-shadow:0 0 0 1px #e3a46b,0 1px 3px rgba(0,0,0,.35)}
.cw3{perspective:700px;padding:20px}
.cube{position:relative;width:96px;height:96px;transform-style:preserve-3d}
.fc{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12px;border-radius:14px;background:linear-gradient(135deg,#fff,#d9dee6);border:1px solid #aab3c0;box-sizing:border-box}
.fc i{align-self:center;justify-self:center;width:15px;height:15px;border-radius:50%}
.fc i.p{background:#14202b;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.f1{transform:translateZ(48px)}.f6{transform:rotateY(180deg) translateZ(48px)}.f2{transform:rotateY(90deg) translateZ(48px)}.f5{transform:rotateY(-90deg) translateZ(48px)}.f3{transform:rotateX(90deg) translateZ(48px)}.f4{transform:rotateX(-90deg) translateZ(48px)}
:root:root:root{--bg:#1a0f05;--pn:rgba(34,19,6,.82);--tx:#f3e6c4;--mu:#cbb27a;--ac:#e0a526;--on:#2a1503;--gold:#ffd25a;--ln:#7a5320;--bad:#ff9a7a;color-scheme:dark}

function ok(o,w){return o&&o.length===3&&[0,1,2].every(function(i){return o.indexOf(i)>-1})&&w[o[0]]>=w[o[1]]&&w[o[1]]>=w[o[2]]}
function calc(g){

g.sets.forEach(function(s,si){
var sp=Z(0),sw=Z(0),prev=Z(0),done=0,rs=[];
s.rounds.forEach(function(r,ri){
var w=Z(0),f=0;
r.m.forEach(function(x){if(x!==null&&x!==undefined){w[x]++;f++}});
var res={w:w,f:f,rk:null,pt:Z(0),bo:[]};
if(f===M){
var p=res.pt,i,rk=w.map(function(a){return 1+w.filter(function(x,j){return x>a&&w.indexOf(x)===j}).length}),n1=rk.filter(function(x){return x===1}).length;
res.rk=rk;done++;
for(i=0;i<N;i++){
if(rk[i]===1){p[i]=3-prev[i];prev[i]++;sw[i]++;rw[i]++;st[i]=0}
else{p[i]=rk[i]===2?2:3;if(++st[i]===3){p[i]++;st[i]=0;res.bo.push(i)}}
sp[i]+=p[i];pts[i]+=p[i];
if(rk[i]===1){if(n1===1&&++rsk[i]===3){ev.push({t:'r3',p:i,n:si*3+ri+1});rsk[i]=0}}else rsk[i]=0}
}
rs.push(res)});
if(done===3){var ks=P.map(function(_,i){return P.map(function(_,j){return j}).filter(function(j){return(sp[j]>sp[i]||sp[j]===sp[i]&&sw[j]>sw[i])&&P.every(function(_,l){return l>=j||sp[l]!==sp[j]||sw[l]!==sw[j]})}).length}),n0=ks.filter(function(k){return k===0}).length;
P.forEach(function(_,i){var k=ks[i];if(k<3)med[i][k]++;if(k===0&&n0===1){ssk[i]++;if(ssk[i]===2)ev.push({t:'s2',p:i,n:si+1});if(ssk[i]===3){ev.push({t:'s3',p:i,n:si+1});ssk[i]=0}}else if(k>0)ssk[i]=0})}
